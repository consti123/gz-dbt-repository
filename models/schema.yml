# schema.yml
version: 2

sources:
  - name: raw
    database: my-own-project-475410
    schema: gz_raw_data
    loader: bigquery
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez
        loaded_at_field: date_date 
        tests:
            - unique:
                column_name: "(orders_id  || '-' || pdt_id)"
        freshness:
          warn_after: {count: 90, period: day}
        columns:
        - name: date_date
          tests: 
            - not_null 
        - name: orders_id
          tests: 
            - not_null
        - name: pdt_id
          tests: 
            - not_null
        - name: revenue
          tests: 
            - not_null
        - name: quantity
          tests: 
            - not_null

      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns: 
        - name: products_id
        - name: purchSE_PRICE
          tests: 
            - not_null
      
      - name: ship
        identifier: raw_gz_ship
        description: ship of Greenweez
        columns: 
        - name: orders_id
          tests: 
            - not_null
        - name: shipping_fee
          tests:
            - not_null
        - name: shipping_fee_1
          tests: 
            - not_null
        - name: logcost
          tests: 
            - not_null
        - name: ship_cost
          tests: 
            - not_null

      - name: adwords
        identifier: raw_gz_adwords
        columns: 
        - name: date_date
        - name: paid_source
        - name: campaign_key
        - name: campaign_name
        - name: ads_cost
        - name: impression
        - name: click 

      - name: bing
        identifier: raw_gz_bing
        columns: 
        - name: date_date
        - name: paid_source
        - name: campaign_key
        - name: campaign_name
        - name: ads_cost
        - name: impression
        - name: click

      - name: criteo
        identifier: raw_gz_criteo
        columns: 
        - name: date_date
        - name: paid_source
        - name: campaign_key
        - name: campaign_name
        - name: ads_cost
        - name: impression
        - name: click


      - name: facebook
        identifier: raw_gz_facebook
        columns: 
        - name: date_date
        - name: paid_source
        - name: campaign_key
        - name: campaign_name
        - name: ads_cost
        - name: impression
        - name: click

      
  - name: int_campaigns
    description: combines all 4 ad campaigns
    test:
    - unique:
    column_name: "(date_date || '-' || campaign_key)"

  - name: int_campaigns_day
    description: campaign day aggregated
    columns:
    - name: date_date
    tests:
      - not_null